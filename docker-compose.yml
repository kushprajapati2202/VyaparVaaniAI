version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: vyaparvaani-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_LIVE_MODEL=gemini-2.0-flash-exp
      - DATABASE_URL=sqlite+aiosqlite:///./vyaparvaani.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: vyaparvaani-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
