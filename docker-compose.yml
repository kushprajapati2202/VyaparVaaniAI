services:
  vyaparvaani:
    build: .
    container_name: vyaparvaani
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_LIVE_MODEL=gemini-3.8-live
      - DATABASE_URL=sqlite+aiosqlite:////app/data/vyaparvaani.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
